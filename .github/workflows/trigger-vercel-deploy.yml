name: Trigger Vercel deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_HOOK_URL"
